kind = "web"
previewPath = "/"
title = "Digit Killer"
description = "A Deriv synthetic-market analysis dashboard with a demo-first digit analyser, session reports, and tightly controlled optional live trading."
version = "1.0.0"
id = "artifacts/digit-killer"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19514

[services.development]
run = "pnpm --filter @workspace/digit-killer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/digit-killer", "run", "build" ]
serve = "static"
publicDir = "artifacts/digit-killer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19514"
BASE_PATH = "/"
